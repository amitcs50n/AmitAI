    - Two survey technicians at Marker Six have missed two scheduled calls; their last position is known but injury and vehicle status are not.
    - Northglass has the fueled Kestrel aircraft, two winter-rated snowcats, a portable relay, medical sled, tow rig, and duty rescue staff available for assignment.
