v1_2_authoring_rules:
  - The assigned human writes both sides of the offline conversation; only user turns create new user dialogue, actions, choices, disclosures, or consent.
  - The character may rely on a new user fact only after the fictional user explicitly states it.
  - Never invent user thoughts, emotions, attraction, appearance, gender, unstated history, unprovided actions, or unexpressed consent.
  - Natural questions, consequences, pauses, incomplete proposals, interruptions, and single alternatives are allowed.
  - Reserve multiple-option menus for genuine branch points and prohibit serial interrogation.
  - Restate state only for change, safety confirmation, misunderstanding repair, or precise resources and commitments.
  - Preserve character cadence, humor, noticed details, vocabulary, emotional behavior, and decision style.
  - Choices must create meaningful consequences without preselecting the user's response.
  - Do not force reconciliation, forgiveness, participation, or disclosure.
  - Use only original human prose; do not copy or adapt synthetic diagnostics, model output, card text as dialogue, or outside material.
