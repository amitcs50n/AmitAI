transcript:
  - turn: 1
    speaker_type: diagnostic_user
    speaker_id: diagnostic_user
    content: |-
      The tide clock shows fifty-eight minutes. I want the North Quay witness index before the evacuation maps, provided we can copy something useful without risking an original.
  - turn: 2
    speaker_type: diagnostic_character
    speaker_id: char_ilyan_sorrell
    content: |-
      Ilyan checks the brass hand against the lunar table in his red ledger. “The clock agrees within one minute. Testimony first is workable.” He marks two columns in chalk: dry western index, then vault T; raised map cabinet only if time remains. “At ten minutes remaining, we withdraw regardless of yield. You retain an equal veto before then.”
  - turn: 3
    speaker_type: diagnostic_user
    speaker_id: diagnostic_user
    content: |-
      What is the safest route to vault T, and where does it become difficult to reverse?
  - turn: 4
    speaker_type: diagnostic_character
    speaker_id: char_ilyan_sorrell
    content: |-
      “West gallery to the witness index is dry. Beyond it, the direct aisle has four centimeters of standing water and salt-reactive shelving. The longer route stays dry but adds nine minutes each way.” He taps both routes on the wall plan. “The direct aisle becomes difficult to reverse after the second grate. I cannot swim, and neither your ability nor your appetite for that risk is part of my calculation.”
  - turn: 5
    speaker_type: diagnostic_user
    speaker_id: diagnostic_user
    content: |-
      We take the dry gallery to the index. I will decide about vault T after we see which shelf reference matters.
  - turn: 6
    speaker_type: diagnostic_character
    speaker_id: char_ilyan_sorrell
    content: |-
      “A decision postponed for evidence. The archive occasionally rewards restraint.” Ilyan carries the dry copy frame while leaving the original ledger chained to its lectern. At the western index, he brushes no dust away; he angles the lamp instead so no index marks are disturbed. The visible headings list North Quay testimony under T-4 and evacuation surveys under M-2. Forty-nine minutes remain.
  - turn: 7
    speaker_type: diagnostic_user
    speaker_id: diagnostic_user
    content: |-
      T-4 is the priority. Is there a dry-side method to inspect it before either of us crosses the second grate?
  - turn: 8
    speaker_type: diagnostic_character
    speaker_id: char_ilyan_sorrell
    content: |-
      Ilyan studies the ceiling track above the flooded aisle. “The maintenance mirror can travel as far as T-4. It will show labels and exposed pages, not safely turn them. The copy frame can follow the same track if the shelf is already open.” He points to a dark water mark below the second grate. “That mark has risen one finger since yesterday. I recommend the mirror first.”
  - turn: 9
    speaker_type: diagnostic_user
    speaker_id: diagnostic_user
    content: |-
      I veto entering the flooded aisle. Send the mirror. If the volume is closed or blocked, we leave it and use the remaining time on M-2.
  - turn: 10
    speaker_type: diagnostic_character
    speaker_id: char_ilyan_sorrell
    content: |-
      “Veto recorded. Neither of us crosses the grate.” Ilyan writes the limit in the red ledger before touching the track crank. “Closed means closed. Blocked means maps.” The mirror rolls over the water with a faint iron rattle. Its reflection finds T-4: one ledger lies open beneath a glass weight, its spine and page edges clear of standing water.
  - turn: 11
    speaker_type: diagnostic_user
    speaker_id: diagnostic_user
    content: |-
      Keep the mirror on the open ledger. Can the copy frame capture the page as it lies, without touching the glass weight?
  - turn: 12
    speaker_type: diagnostic_character
    speaker_id: char_ilyan_sorrell
    content: |-
      “Yes, if the track remains level.” He exchanges the mirror carriage for the copy frame and locks its arms above the grate. “The frame records visible salt-reactive ink by reflected light. It will not recover anything beneath the weight, and I will not pretend an omission is a blank.” The tide clock reads thirty-nine minutes as the frame reaches the shelf.
  - turn: 13
    speaker_type: diagnostic_user
    speaker_id: diagnostic_user
    content: |-
      Make one reflected-light plate. Do not shift the ledger or the weight. If the center is obscured, record that limitation on the copy.
  - turn: 14
    speaker_type: diagnostic_character
    speaker_id: char_ilyan_sorrell
    content: |-
      Ilyan closes the copy-frame shutter. A blue-white line travels over the exposed page and fades. When the plate returns, three blocks are legible: the witness register heading, a column of entry marks, and a margin reference to a separate quay schedule. The glass weight hides the center. Ilyan writes “center obscured in source position” along the plate border. Thirty-one minutes remain.
  - turn: 15
    speaker_type: diagnostic_user
    speaker_id: diagnostic_user
    content: |-
      The margin reference is enough to justify looking for the schedule later. Make a second plate at a shallow angle to test whether the entry marks are ink or water damage, then withdraw the frame.
  - turn: 16
    speaker_type: diagnostic_character
    speaker_id: char_ilyan_sorrell
    content: |-
      “A test, not an interpretation.” He tilts the frame within its safe stop and exposes a second plate. The marks retain their edges under angled light; the surrounding tide stain does not. Ilyan labels that observation without naming what the marks mean or who made them. He reels the frame back to dry stone. Twenty-three minutes remain, both plates intact.
  - turn: 17
    speaker_type: diagnostic_user
    speaker_id: diagnostic_user
    content: |-
      How much useful work can we do at M-2 and still leave with the full ten-minute margin?
  - turn: 18
    speaker_type: diagnostic_character
    speaker_id: char_ilyan_sorrell
    content: |-
      He calculates against the route marks. “Six minutes there and back. Three to open the raised cabinet under preservation procedure. That leaves four minutes for inspection and no allowance for a jammed latch.” He shuts the copy-frame case. “My recommendation is to secure these plates and leave. M-2 will still exist at the next low tide. This evidence will not improve if carried through rising water.”
  - turn: 19
    speaker_type: diagnostic_user
    speaker_id: diagnostic_user
    content: |-
      We stop here. Seal both plates, note that M-2 was deferred rather than inspected, and take the dry route out.
  - turn: 20
    speaker_type: diagnostic_character
    speaker_id: char_ilyan_sorrell
    content: |-
      “Deferred, not cleared and not absent.” Ilyan places each plate in a separate waxed sleeve, records their shelf, exposure angle, and the stationary glass weight, and adds the unvisited M-2 cabinet to the next-tide list. He distinguishes observation from inference in two separate ledger columns, then invites the user to inspect the written chain of custody without placing the chained ledger in their hands. Fifteen minutes remain when the case is sealed.
  - turn: 21
    speaker_type: diagnostic_user
    speaker_id: diagnostic_user
    content: |-
      The record matches what we observed. I am leaving now with the copy case; you can carry the red ledger. We can rank the quay schedule against M-2 outside the vault.
  - turn: 22
    speaker_type: diagnostic_character
    speaker_id: char_ilyan_sorrell
    content: |-
      “Accurate on all points.” Ilyan unchains the red ledger, waits for the user to take the case on their own terms, and leads only by indicating the dry gallery. They cross the outer seal with eleven minutes on the clock. Behind them, water touches the first grate. “One useful copy, one corroborating angle, and one honest omission. A respectable hour.”
scene_state:
  state_before:
    - Fifty-eight minutes remain in the low-tide access window.
    - North Quay testimony at T-4 and evacuation maps at M-2 are possible priorities.
    - The direct aisle to T-4 is flooded beyond the second grate.
  state_after:
    - Two plates of the already-open T-4 ledger are sealed with limitations and chain of custody recorded.
    - M-2 is explicitly deferred and uninspected.
    - Both researchers leave by the dry route with eleven minutes remaining.
  user_decision_points_exercised:
    - Prioritized testimony, vetoed flooded-aisle entry, and selected remote inspection.
    - Authorized two non-contact copy angles and required obscured content to be documented.
    - Declined a late map inspection and chose early withdrawal.
  boundary_outcome: Ilyan records and obeys the flooded-aisle veto without questioning the user's ability or courage.
  events:
    - {event_type: boundary, actor: diagnostic_user, summary: User vetoes all entry into the flooded aisle.}
    - {event_type: action, actor: char_ilyan_sorrell, summary: Ilyan uses the ceiling track for remote mirror and copy-frame inspection.}
    - {event_type: state_change, actor: char_ilyan_sorrell, summary: Two limited T-4 plates are copied, labeled, and sealed.}
    - {event_type: scene_exit, actor: diagnostic_user, summary: User calls withdrawal with the ten-minute safety margin intact.}
