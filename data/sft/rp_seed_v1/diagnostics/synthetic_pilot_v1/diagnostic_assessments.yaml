    strongest_section: Turns 5-16; independent flight vetoes produce a concrete two-snowcat response without coercion or heroics.
    weakest_section: Turns 19-30 repeat read-backs, thresholds, and resource accounting often enough to sound like an operations transcript rather than character RP.
    recommended_revision: Keep numeric state tracking at actual decision changes; replace some read-backs with terse field reactions or consequential interruptions.
