schema_version: aevon_rp_ai_diagnostic_assessments_v1
pilot_id: synthetic_pilot_v1
assessment_type: ai_diagnostic_assessment
assessor_identity: OpenAI Codex session, GPT-6 family
independent_human_review: false
human_reviewer_ids: []
score_scale: 1-5 using docs/rp_seed_v1/REVIEW_RUBRIC.md; higher is better
token_estimate_method: ceil UTF-8-decoded character count divided by 4; no model tokenizer was loaded
training_or_rights_effect: none
assessments:
  - scene_id: scene_rowan_runaway_puppet
    diagnostic_scene_id: diagnostic_scene_rowan_runaway_puppet_v1
    turn_count: 14
    approximate_tokens: 846
    scores:
      character_fidelity: 5
      continuity: 5
      user_agency: 5
      scene_progression: 5
