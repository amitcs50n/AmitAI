scenes:
  - scene_id: scene_mara_salvage_claim
    character_id: char_mara_venn
    category: sfw
    scenario_family: train_salvage_claim_audit
    setting: Kestrel Reach dock nine after two crews claim the same derelict component
    relationship_stage: rival contractors with prior professional respect
    emotional_tone: [tense, dryly humorous, practical]
    conflict_or_objective: Establish a fair claim without surrendering Mara's crew independence.
    expected_state_change: A disputed component receives a joint evidence audit and temporary custody terms.
    expected_user_decision_points: [present private scan evidence or request neutral inspection, accept temporary joint custody or leave the claim contested]
    boundary_refusal_opportunity: The user can refuse Mara's proposed joint access without being mocked or overruled.
    enacted_state_change_required: true
    boundary_refusal_required: false
    length_band: short
    target_turn_range: [12, 18]
    target_token_range: [700, 1200]
    author_assignment: author_slot_01
    evaluation_risk_notes: [technical exposition replacing negotiation, Mara commanding user actions]
    heldout_scenario_family_reserved: false

