    file: sonnet35-charcard-roleplay-sharegpt.jsonl
    adapter: sharegpt
    intended_usage: Candidate for character fidelity and multi-turn RP quality review.
    declared_license: unknown
    enabled_by_default: false
    manual_review_required: true
