      file: data/sft/v1/batch_01.jsonl
      status: approved_after_manual_review
      review: data/sft/v1/batch_01_review.yaml
      category_counts: &batch_a
        normal_conversation: 3
        technical_coding: 4
        reasoning_decision_support: 3
        disagreement_correction: 2
        uncertainty_hallucination_resistance: 2
        emotional_practical_support: 1
        tool_behavior: 1
        memory_continuity: 1
        creative_roleplay: 2
        boundaries_concise_refusals: 1
    - id: batch_02
      file: data/sft/v1/batch_02.jsonl
      status: ready_for_creation
      category_counts: *batch_a
    - id: batch_03
      file: data/sft/v1/batch_03.jsonl
      status: pending_batch_02_approval
      category_counts: &batch_b
        normal_conversation: 3
        technical_coding: 4
        reasoning_decision_support: 2
        disagreement_correction: 2
        uncertainty_hallucination_resistance: 2
        emotional_practical_support: 1
        tool_behavior: 2
        memory_continuity: 1
        creative_roleplay: 2
        boundaries_concise_refusals: 1
    - id: batch_04
      file: data/sft/v1/batch_04.jsonl
      status: pending_batch_03_approval
      category_counts: &batch_c
        normal_conversation: 3
        technical_coding: 4
        reasoning_decision_support: 2
        disagreement_correction: 2
        uncertainty_hallucination_resistance: 1
        emotional_practical_support: 2
        tool_behavior: 2
        memory_continuity: 1
        creative_roleplay: 2
        boundaries_concise_refusals: 1
    - id: batch_05
      file: data/sft/v1/batch_05.jsonl
      status: pending_batch_04_approval
      category_counts: *batch_c

diversity_targets:
  turn_depth:
    single_user_turn: 60
    two_to_three_user_turns: 30
    four_or_more_user_turns: 10
  assistant_response_length:
    short: 35
    medium: 50
    long: 15
  per_batch_targets:
    single_user_turn: 12
    two_to_three_user_turns: 6
    four_or_more_user_turns: 2
    short_responses: 7
    medium_responses: 10
    long_responses: 3
  format_minimums:
    code_only: 3
    exact_sentence_or_word_count: 5
    explicit_no_bullets_or_no_headings: 5
    structured_list_or_table: 8
  style_limits:
    examples_with_profanity_maximum: 8
    examples_with_explicit_humor_maximum: 15
    identical_assistant_opening_maximum: 3

quality_requirements:
  - Every conversation must solve a realistic user need, not announce or explain a behavior rule.
  - Most rows must focus on one to three primary rules instead of demonstrating every trait.
  - Technical content must be factually reviewed and must not claim execution that did not occur.
  - User tones, domains, constraints, openings, response shapes, and conversation depth must vary.
  - Profanity and disagreement are optional behaviors, not quotas or personality catchphrases.
  - Tool examples in SFT v1 teach selection, honesty, permission, and status language only.
  - Memory examples may use fictional supplied context but no real personal or sensitive data.
  - Every memory example must be genuinely multi-turn rather than describing prior turns in one prompt.
  - Creative examples must stay in the core profile; adult-extension training is a separate dataset.
  - Boundary examples must include at least one benign edge case that receives a useful answer.
  - Held-out eval prompts and close paraphrases must never appear in training.

batch_review_gate:
  required_checks:
    - JSONL parses and every row passes the dataset schema validator.
    - IDs are unique within the batch and across all earlier approved batches.
    - Category counts match the batch plan exactly.
    - Every primary rule exists in the frozen 1.0.0 behavior spec.
    - No prompt duplicates or closely paraphrases another SFT or held-out eval prompt.
    - Exact overlap checks are automated; semantic and scenario overlap is reviewed manually.
    - Every assistant response is factually and technically correct for its scenario.
    - Conversations read naturally and do not mention internal rule IDs or training objectives.
    - Openings, conclusions, jokes, profanity, formatting, and sentence patterns are not repetitive.
    - Tool results, memories, citations, and completed actions are never fabricated.
    - All 20 rows receive manual approval before the next batch begins.
  rejection_policy:
    - Fix or replace rejected rows within the current batch before continuing.
    - Do not modify the frozen behavior spec to rescue a weak example.
    - A behavior-rule change requires spec 1.1.0 and an explicit dataset-impact review.

merge_policy:
  include_only_approved_batches: true
  preserve_batch_order: true
  exclude_placeholder_dataset: data/sft/amitai_sft_v0.jsonl
  exclude_held_out_eval: eval/behavior_v1.jsonl
  final_validation:
    - exactly 100 records
    - exact category totals from category_mix
    - unique IDs
    - spec_version 1.0.0 on every row
    - no train-eval prompt overlap
