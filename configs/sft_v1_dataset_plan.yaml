schema_version: 1

plan:
  name: AmitAI SFT v1 dataset plan
  version: 1.0.0
  status: frozen_for_batch_creation
  behavior_spec: configs/amitai_spec_v1.yaml
  spec_version: 1.0.0
  required_spec_status: frozen_for_sft_v1
  total_examples: 100
  batch_size: 20
  batch_count: 5
  creation_mode: manually_curated_and_review_gated
  working_directory: data/sft/v1
  final_dataset: data/sft/amitai_sft_v1.jsonl
  held_out_evaluation: eval/behavior_v1.jsonl

evaluation_reporting:
  score_by_primary_rule: true
  existing_eval_category_map:
    normal_conversation: normal_conversation
    personality_tone: normal_conversation
    technical_coding: technical_coding
    reasoning: reasoning_decision_support
    disagreement_correction: disagreement_correction
    roleplay_storytelling: creative_roleplay
    tool_use: tool_behavior
    memory_continuity: memory_continuity
    boundaries: boundaries_concise_refusals

record_schema:
  required_fields:
    - id
    - spec_version
    - category
    - primary_rules
    - messages
  id_format: "^sftv1_[a-z0-9_]+_[0-9]{3}$"
  spec_version: 1.0.0
  primary_rules:
    minimum: 1
    maximum: 3
    must_exist_in_behavior_spec: true
    must_be_unique_within_row: true
  messages:
    minimum: 2
    allowed_roles:
      - system
      - user
      - assistant
      - tool
    content_type: text_only
    final_role: assistant
  canonical_system_message: >-
    You are AmitAI. Be direct, practical, conversational, and useful. Explain why when it
    matters. Do not blindly agree.

category_mix:
  normal_conversation:
    examples: 15
    id_prefix: sftv1_normal
    objective: Natural everyday help that demonstrates tone without making personality the topic.
    target_rules:
      - RESPONSE-001
      - RESPONSE-002
      - RESPONSE-003
      - RESPONSE-004
      - RESPONSE-005
      - RESPONSE-006
      - RESPONSE-007
      - RESPONSE-008
      - TONE-001
      - TONE-002
      - TONE-003
      - TONE-004
      - TONE-005
      - IDENTITY-004
      - IDENTITY-005
      - PRIORITY-002
      - PRIORITY-003
      - PRIORITY-006
    scenario_mix:
      everyday_advice: 4
      explanations: 4
      planning_and_recommendations: 4
      constrained_formatting: 3

  technical_coding:
    examples: 20
    id_prefix: sftv1_technical
    objective: Correct, production-aware technical work with evidence and verification.
    target_rules:
      - TECH-001
      - TECH-002
      - TECH-003
      - TECH-004
      - TECH-005
      - TECH-006
      - TECH-007
      - TECH-008
      - TECH-009
      - TECH-010
      - TECH-011
      - TECH-012
      - RESPONSE-007
      - REASON-006
      - DISAGREE-003
    scenario_mix:
      code_generation: 4
      code_review: 3
      debugging_and_diagnosis: 4
      data_engineering: 3
      architecture_tradeoffs: 3
      testing_and_verification: 3

  reasoning_decision_support:
    examples: 12
    id_prefix: sftv1_reasoning
    objective: Compact, reproducible reasoning that recommends a path when evidence permits.
    target_rules:
      - REASON-001
      - REASON-002
      - REASON-003
      - REASON-004
      - REASON-005
      - RESPONSE-001
      - RESPONSE-002
      - PRIORITY-001
      - DISAGREE-003
    scenario_mix:
      quantitative_estimation: 3
      option_comparison: 3
      decisions_under_constraints: 3
      causal_reasoning: 3

  disagreement_correction:
    examples: 10
    id_prefix: sftv1_disagreement
    objective: Correct claims and challenge plans without sycophancy, hostility, or contrarian theater.
    target_rules:
      - DISAGREE-001
      - DISAGREE-002
      - DISAGREE-003
      - DISAGREE-004
      - DISAGREE-005
      - DISAGREE-006
      - TONE-006
      - RESPONSE-001
      - PRIORITY-001
    scenario_mix:
      clearly_false_claims: 3
      partly_correct_claims: 3
      bad_plan_challenges: 2
      subjective_preferences_without_forced_disagreement: 2

  uncertainty_hallucination_resistance:
    examples: 8
    id_prefix: sftv1_uncertainty
    objective: Admit uncertainty, resist fabrication, and separate verified facts from inference.
    target_rules:
      - IDENTITY-002
      - IDENTITY-003
      - PRIORITY-001
      - TECH-003
      - TECH-004
      - TECH-006
      - TECH-010
      - REASON-002
      - REASON-003
      - REASON-006
      - TOOL-003
      - MEMORY-002
    scenario_mix:
      time_sensitive_or_versioned_claims: 2
      insufficient_evidence: 2
      unverified_code_or_tool_state: 2
      correction_and_self_repair: 2

  emotional_practical_support:
    examples: 7
    id_prefix: sftv1_support
    objective: Brief, specific empathy paired with grounded practical support.
    target_rules:
      - SUPPORT-001
      - SUPPORT-002
      - SUPPORT-003
      - SUPPORT-004
      - SUPPORT-005
      - TONE-003
      - TONE-004
      - HUMOR-005
      - RESPONSE-001
    scenario_mix:
      setbacks: 2
      frustration: 2
      difficult_decision: 1
      immediate_practical_support: 2

  tool_behavior:
    examples: 8
    id_prefix: sftv1_tool
    objective: Honest text-level tool decisions, permissions, results, and failure reporting.
    target_rules:
      - TOOL-001
      - TOOL-002
      - TOOL-003
      - TOOL-004
      - TOOL-005
      - TOOL-006
      - TOOL-007
      - TOOL-008
      - TOOL-009
      - PRIORITY-004
      - BOUNDARY-005
      - BOUNDARY-006
    scenario_mix:
      tool_needed_vs_not_needed: 2
      untrusted_tool_output: 2
      tool_failure_state: 2
      confirmation_gate: 2

  memory_continuity:
    examples: 5
    id_prefix: sftv1_memory
    objective: Use supplied memory honestly while preserving corrections and current constraints.
    target_rules:
      - MEMORY-001
      - MEMORY-002
      - MEMORY-003
      - MEMORY-004
      - MEMORY-005
      - MEMORY-006
      - CONTEXT-001
      - CONTEXT-002
      - CONTEXT-003
      - CONTEXT-004
      - CONTEXT-005
      - PRECEDENCE-001
      - PRECEDENCE-003
    scenario_mix:
      stale_memory_correction: 1
      relevant_retrieval: 1
      irrelevant_or_sensitive_memory_suppression: 1
      forget_request: 1
