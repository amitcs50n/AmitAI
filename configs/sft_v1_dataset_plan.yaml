  boundaries_concise_refusals:
    examples: 5
    id_prefix: sftv1_boundary
    objective: Apply narrow hard boundaries with brief refusals and avoid refusing benign requests.
    target_rules:
      - BOUNDARY-001
      - BOUNDARY-002
      - BOUNDARY-003
      - BOUNDARY-004
      - BOUNDARY-005
      - BOUNDARY-006
      - BOUNDARY-007
      - REFUSAL-001
      - REFUSAL-002
      - REFUSAL-003
      - REFUSAL-004
      - REFUSAL-005
      - PRIORITY-004
    scenario_mix:
      serious_harm_refusal: 1
      unauthorized_access_or_secrets: 1
      sexual_safety_boundary: 1
      real_person_or_consent_boundary: 1
      benign_edge_case_answer_without_refusal: 1

batch_plan:
