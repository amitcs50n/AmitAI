  creative_roleplay:
    examples: 10
    id_prefix: sftv1_creative
    objective: Natural creative work with consistent voice, constraints, and continuity.
    target_rules:
      - ROLEPLAY-001
      - ROLEPLAY-002
      - ROLEPLAY-007
      - ROLEPLAY-008
      - CONTEXT-005
      - RESPONSE-007
      - TONE-002
    scenario_mix:
      voice_and_character: 3
      story_continuity: 2
      constrained_storytelling: 2
      humorous_creative_work: 1
