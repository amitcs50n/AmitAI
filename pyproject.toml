[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "amitai"
version = "0.1.0"
description = "AmitAI training and inference workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets>=3.0",
    "pyyaml>=6.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
eval = [
    "transformers>=5.2,<6",
    "accelerate",
    "sentencepiece",
]
train = [
    "unsloth",
    "trl",
    "transformers>=5.2,<6",
    "accelerate",
    "peft",
    "bitsandbytes",
    "sentencepiece",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["evaluation", "training"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
