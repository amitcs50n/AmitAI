[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "amitai"
version = "0.1.0"
description = "AmitAI training and inference workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography>=46,<51",
    "datasets>=3.0",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "pillow>=12.3,<13",
    "python-multipart>=0.0.22,<0.1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
encrypted-storage = [
    "sqlcipher3==0.6.2",
]
secure-runtime = [
    "argon2-cffi>=25,<26",
    "pywin32>=311; platform_system == 'Windows'",
]
eval = [
    "transformers>=5.2,<6",
    "accelerate",
    "sentencepiece",
]
runtime = [
    "transformers>=5.2,<6",
    "accelerate",
    "sentencepiece",
]
train = [
    "unsloth",
    "trl",
    "transformers>=5.2,<6",
    "accelerate",
    "peft",
    "bitsandbytes",
    "sentencepiece",
]
dev = [
    "jinja2>=3.1.6,<4",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["backend", "evaluation", "runtime", "training"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
